<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Project · Printdeck</title>
<!-- preview -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/pwf.js" defer></script>
</head>
<body data-page="public">
<div class="wrap">
  <header>
    <span class="brand"><i></i>Printdeck</span>
  </header>
  <p class="lcd" id="loading">LOADING</p>
  <section class="view" id="vPublic" hidden>
    <h1 id="pName"></h1>
    <p class="dim" id="pNote"></p>
    <p class="dim small" id="pMeta"></p>
    <div class="photos" id="photos"></div>
    <h2 class="section">Prints</h2>
    <p class="dim small" id="noPrints">No prints yet.</p>
    <div class="prints" id="prints"></div>
  </section>
  <footer>
    <span>A project of 3D prints, shared with Printdeck. <a href="/app">Members sign in</a>.</span>
    <span>Printdeck is free software under the GNU AGPL, version 3. <a href="https://github.com/beetlebugorg/printdeck">The source of this service</a>.</span>
  </footer>
</div>
</body>
</html>
