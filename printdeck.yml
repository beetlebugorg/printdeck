# Printdeck builds: the printed parts of the Slate v4, the desk case of Printdeck
# (lulzbot/stl/slate/README.md), and the webcam mounts on the printer. The profiles are in
# profiles/. The Slate prints in navy (the case) and orange (the base). The webcam mounts print
# in black PLA (roll-4).
# No generate step: lulzbot/slate.py export writes the Slate files, and lulzbot/make.sh and
# pod.py export the others. Run them on your computer, and commit the STL files.
project: printdeck

parts:
  # The Slate v4 (FDM): the case in navy PLA (roll-3), the base in orange PLA (roll-2). No part
  # needs supports. The seam goes to the sharpest corner, on the inside.
  - name: Slate frame
    files: [lulzbot/stl/slate/fdm/slate-frame_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-3
    settings: &pod {support_enable: false, z_seam_type: sharpest_corner, z_seam_corner: z_seam_corner_inner}
  - name: Slate body
    files: [lulzbot/stl/slate/fdm/slate-body_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-3
    settings: *pod
  - name: Slate base
    files: [lulzbot/stl/slate/fdm/slate-base_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-2
    settings: *pod

  # The Slate v4 (resin): the case is one part. Paint is an option in place of colored resin.
  - name: Slate case (resin)
    files: [lulzbot/stl/slate/resin/slate-case_resin.stl]
    printer: phenom
    profile: peopoly-phenom/abs-like-0.05
    material: Navy resin
  - name: Slate base (resin)
    files: [lulzbot/stl/slate/resin/slate-base_resin.stl]
    printer: phenom
    profile: peopoly-phenom/abs-like-0.05
    material: Orange resin

  # The webcam (option): a C270 on the frame of the printer.
  - name: Camera arm (TAZ)
    files: [lulzbot/stl/pod/fdm/camera-arm-taz_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera clamp (TAZ)
    files: [lulzbot/stl/pod/fdm/camera-clamp-taz_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    # It is 126 mm tall: a brim.
    settings: {<<: *pod, adhesion_type: brim}
  - name: Camera arm (Mini 2)
    files: [lulzbot/stl/pod/fdm/camera-arm-mini2_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera clamp (Mini 2)
    files: [lulzbot/stl/pod/fdm/camera-clamp-mini2_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod

# The PDFs of the project. The project page shows each one with a picture of its first page.
docs:
  - name: LulzBot build guide
    file: lulzbot/printdeck-lulzbot-build.pdf
