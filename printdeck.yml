# Printdeck builds: the printed parts of the Slate v4, the desk case of Printdeck
# (lulzbot/stl/slate/README.md), and the webcam mounts on the printer. The profiles are in
# profiles/. The Slate prints in navy (the case) and orange (the base). The webcam mounts print
# in black PLA (roll-4).
# The generate step writes the STL files again on GitHub, and fails when they differ from the
# committed files. Run the same commands on your computer, and commit the STL files.
project: printdeck

generate:
  install: pip install -r lulzbot/requirements.txt
  run: cd lulzbot && python slate.py export && python slate.py assembly && python pod.py export && python pod.py assembly
  check: true

# The picture of the project in the project lists: lulzbot/cover.py makes it from the render.
cover: docs/img/cover.png

# The shop pages of the filament of the parts, for the Reorder links of the project pages. The
# TAZ takes 2.85 mm filament, so that link is first. The 1.75 mm link is for other printers.
materials:
  roll-4:
    buy:
      2.85 mm: https://www.matterhackers.com/store/l/300mm-pla-filament-black-1-kg/sk/MSEWRUAW
      1.75 mm: https://www.matterhackers.com/store/l/black-mh-build-series-pla-filament-175mm-1kg-cardboard/sk/MNCJPEK5
  roll-3:
    buy:
      2.85 mm: https://www.matterhackers.com/store/l/navy-blue-mh-build-pla-filament-285mm-1kg/sk/MJXAU8A8
      1.75 mm: https://www.matterhackers.com/store/l/navy-blue-mh-build-pla-filament-175mm-1kg/sk/MW59CY2X
  roll-2:
    buy:
      2.85 mm: https://www.matterhackers.com/store/l/esun-pla-filament-175mm-1kg/sk/MN7PRDDD
      1.75 mm: https://www.matterhackers.com/store/l/esun-pla-filament-175mm-1kg/sk/MWUQC9GP

parts:
  # The Slate v4 (FDM): the case in navy PLA (roll-3), the base in orange PLA (roll-2). No part
  # needs supports. The seam goes to the sharpest corner, on the inside. Each part has a 5 mm brim
  # (10 lines of the 0.5 mm nozzle), so its corners stay down on the bed.
  - name: Slate frame
    group: Slate v4 (FDM)
    description: >-
      The frame goes around the Touch Display 2, behind the glass. Four M2.5 x 4 screws hold it on the
      tabs of the display. Press four M3 heat-set inserts into its bosses before you assemble the
      case. It prints on its back ring with no supports.
    files: [lulzbot/stl/slate/fdm/slate-frame_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-3
    settings: &slate {support_enable: false, z_seam_type: sharpest_corner, z_seam_corner: z_seam_corner_inner,
                      adhesion_type: brim, brim_line_count: 10}
  - name: Slate body
    group: Slate v4 (FDM)
    description: >-
      The body goes around the Raspberry Pi 5 and its Active Cooler. The ports of the Pi are flush
      with its walls, and the vents in its back let air to the cooler. Press two M3 hex nuts into the
      rings on its inner floor. Four M3 x 6 screws go down its posts into the inserts of the frame.
    files: [lulzbot/stl/slate/fdm/slate-body_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-3
    settings: *slate
  - name: Slate base
    group: Slate v4 (FDM)
    description: >-
      The base holds the case on the desk and leans it back 15 degrees. The case stands on five ribs
      between the cheeks, behind the lip of the chin. Two M3 x 8 screws go from behind through the
      boss into the nuts of the body. The base prints standing on the bottom of its foot, 113 mm high.
    files: [lulzbot/stl/slate/fdm/slate-base_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-2
    settings: *slate

  # The Slate v4 (resin): the case is one part. Paint is an option in place of colored resin.
  - name: Slate case (resin)
    group: Slate v4 (resin)
    description: >-
      The resin case is the frame and the body as one part. Press two M3 hex nuts into the rings on
      its inner floor. The display with the Pi slides in from the front, and four M2.5 x 4 screws hold
      it. Two wells in the back give access to the two lower screws.
    files: [lulzbot/stl/slate/resin/slate-case_resin.stl]
    printer: phenom
    profile: peopoly-phenom/abs-like-0.05
    material: Navy resin
  - name: Slate base (resin)
    group: Slate v4 (resin)
    description: >-
      The base holds the case on the desk and leans it back 15 degrees. It has the shape of the FDM
      base, with a closer fit to the resin case. Two M3 x 8 screws go from behind through the boss
      into the nuts of the case. Print it with the back plate vertical, on supports under the foot.
    files: [lulzbot/stl/slate/resin/slate-base_resin.stl]
    printer: phenom
    profile: peopoly-phenom/abs-like-0.05
    material: Orange resin

  # The webcam (option): an Arducam B0561 on the frame of the printer. The camera hangs in its U
  # bracket under the link, and the link is on the hinge of the arm.
  - name: Camera arm (TAZ)
    group: Webcam mount (TAZ)
    description: >-
      The arm holds the Arducam B0561 camera at the front right corner of the TAZ Workhorse. An M3 x
      16 screw through its two lugs and the tongue of the link is the hinge. Two M3 x 18 screws hold
      its post in the tab of the clamp. It prints on its back face.
    files: [lulzbot/stl/pod/fdm/camera-arm-taz_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: &pod {support_enable: false, z_seam_type: sharpest_corner, z_seam_corner: z_seam_corner_inner}
  - name: Camera clamp (TAZ)
    group: Webcam mount (TAZ)
    description: >-
      The clamp holds the camera arm on the front right upright of the TAZ Workhorse. Its saddle keys
      go into the slots of the upright, and two M3 x 8 screws go into roll-in T-nuts. Press two M3
      heat-set inserts into its tab for the screws of the arm. It is 126 mm tall, so it prints on its
      bottom with a brim.
    files: [lulzbot/stl/pod/fdm/camera-clamp-taz_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    # It is 126 mm tall: a brim.
    settings: {<<: *pod, adhesion_type: brim}
  - name: Camera clamp fit test (TAZ)
    group: Webcam mount (TAZ)
    description: >-
      The bottom 12 mm of the TAZ clamp, with its two keys. Print it before the clamp, and push it onto
      the front right upright under the corner plate. It must go on by hand with no play, and both legs
      must lie flat on the faces of the upright. It prints in a few minutes.
    files: [lulzbot/stl/pod/fdm/camera-clamp-fit-taz_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera link (TAZ)
    group: Webcam mount (TAZ)
    description: >-
      The link holds the Arducam B0561 under the arm. Its tongue goes between the lugs of the arm, and
      the M3 x 16 hinge screw holds it level. A 1/4"-20 x 1/4" screw goes down through its plate into
      the thread in the base of the U bracket of the camera. The pivot of the U sets the tilt. It is
      the same part for the TAZ and the Mini 2. It prints on the top face of its plate.
    files: [lulzbot/stl/pod/fdm/camera-link_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera arm (Mini 2)
    group: Webcam mount (Mini 2)
    description: >-
      The arm holds the Arducam B0561 camera at the front right corner of the Mini 2. An M3 x 16 screw
      through its two lugs and the tongue of the link is the hinge. Two M3 x 18 screws hold its post
      in the tab of the clamp. It prints on its back face.
    files: [lulzbot/stl/pod/fdm/camera-arm-mini2_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera clamp (Mini 2)
    group: Webcam mount (Mini 2)
    description: >-
      The clamp holds the camera arm on the front right corner of the Mini 2. The lip of its plate
      goes on the top of the frame. Two frame screws, 5 mm longer than the original screws, hold it.
      Press two M3 heat-set inserts into its tab for the screws of the arm.
    files: [lulzbot/stl/pod/fdm/camera-clamp-mini2_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  - name: Camera link (Mini 2)
    group: Webcam mount (Mini 2)
    description: >-
      The link holds the Arducam B0561 under the arm. Its tongue goes between the lugs of the arm, and
      the M3 x 16 hinge screw holds it level. A 1/4"-20 x 1/4" screw goes down through its plate into
      the thread in the base of the U bracket of the camera. The pivot of the U sets the tilt. It is
      the same part for the TAZ and the Mini 2. It prints on the top face of its plate.
    files: [lulzbot/stl/pod/fdm/camera-link_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    settings: *pod
  # The cable clips of the webcam cable, along the frame of the printer. They are better in PETG:
  # PLA can crack where the arms bend. The profiles have no PETG material yet.
  - name: Cable clip, single (webcam, TAZ)
    group: Cable clips
    description: >-
      The clips hold the USB cable of the webcam along the frame of the TAZ Workhorse. Each clip goes
      on the frame with 12 x 12 mm foam tape. Print them in PETG if you can, because PLA can crack
      where the arms bend.
    files: [lulzbot/stl/pod/fdm/cable-clip-single_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    count: 4
    settings: *pod
  - name: Cable clip, single (webcam, Mini 2)
    group: Cable clips
    description: >-
      The clips hold the USB cable of the webcam along the frame of the Mini 2. Each clip goes on the
      frame with 12 x 12 mm foam tape. Print them in PETG if you can, because PLA can crack where the
      arms bend.
    files: [lulzbot/stl/pod/fdm/cable-clip-single_fdm.stl]
    printer: taz
    profile: taz-workhorse-se/pla-0.20-standard
    material: roll-4
    count: 3
    settings: *pod

# The PDFs of the project. The project page shows each one with a picture of its first page.
docs:
  - name: Slate v4 build guide
    file: lulzbot/printdeck-slate-v4-build.pdf

# The 3D views of the assembled Slate. lulzbot/slate.py assembly writes the files: each part in its
# place, in mm, z up, with the origin at the middle of the foot on the desk. The case leans back 15
# degrees, so "up the case" is (0, 0.26, 0.97) and "out of the front" is (0, -0.97, 0.26). The length
# of an explode vector sets how far the item moves.
assemblies:
  # The items are in the order of the assembly, and the exploded view takes them off from the last.
  # Items next to each other with the same explode move together (the inserts with the frame, the
  # nuts with the body). Each kind of screw has its own file and comes out along its axis, so the
  # screws have small changes of the direction to stay apart.
  - name: Slate v4 (FDM)
    description: |
      The FDM Slate: the navy frame and body on the orange base, with the display, the Pi 5 and the screws. The screws come out of the back. The body lifts off, and then the frame and the Pi come off the back of the display.
    items:
      - part: Slate base
        file: lulzbot/stl/slate/assembly/base-fdm.stl
      - name: Touch Display 2
        file: lulzbot/stl/slate/assembly/display.stl
        color: "#1b1d22"
        explode: [0, -0.97, 0.26]
      - name: Raspberry Pi 5 with Active Cooler
        file: lulzbot/stl/slate/assembly/pi5.stl
        color: "#1f6b45"
        explode: [0, 0.97, -0.26]
      - name: M2.5 screws (Pi)
        file: lulzbot/stl/slate/assembly/screws-pi.stl
        color: "#b9bec6"
        explode: [0, 1, -0.3]
      - part: Slate frame
        file: lulzbot/stl/slate/assembly/frame.stl
        explode: [0, 0.97, -0.26]
      - name: M3 heat-set inserts
        file: lulzbot/stl/slate/assembly/inserts-frame.stl
        color: "#c9a14a"
        explode: [0, 0.97, -0.26]
      - name: M2.5 x 4 screws (display)
        file: lulzbot/stl/slate/assembly/screws-frame.stl
        color: "#b9bec6"
        explode: [0, 1, -0.27]
      - part: Slate body
        file: lulzbot/stl/slate/assembly/body.stl
        explode: [0, 0.26, 0.97]
      - name: M3 hex nuts
        file: lulzbot/stl/slate/assembly/nuts-joint.stl
        color: "#b9bec6"
        explode: [0, 0.26, 0.97]
      - name: M3 x 6 screws (body)
        file: lulzbot/stl/slate/assembly/screws-body.stl
        color: "#b9bec6"
        explode: [0, 1, -0.25]
      - name: M3 x 8 screws (base)
        file: lulzbot/stl/slate/assembly/screws-joint.stl
        color: "#b9bec6"
        explode: [0, 1, -0.28]
  - name: Slate v4 (resin)
    description: |
      The resin Slate: the navy case in one part on the orange base, with the display, the Pi 5 and the screws. The screws come out of the back. The case lifts off, and then the Pi comes off the back of the display.
    items:
      - part: Slate base (resin)
        file: lulzbot/stl/slate/assembly/base-resin.stl
      - name: Touch Display 2
        file: lulzbot/stl/slate/assembly/display.stl
        color: "#1b1d22"
        explode: [0, -0.97, 0.26]
      - name: Raspberry Pi 5 with Active Cooler
        file: lulzbot/stl/slate/assembly/pi5.stl
        color: "#1f6b45"
        explode: [0, 0.97, -0.26]
      - name: M2.5 screws (Pi)
        file: lulzbot/stl/slate/assembly/screws-pi.stl
        color: "#b9bec6"
        explode: [0, 1, -0.3]
      - part: Slate case (resin)
        file: lulzbot/stl/slate/assembly/case-resin.stl
        explode: [0, 0.26, 0.97]
      - name: M3 hex nuts
        file: lulzbot/stl/slate/assembly/nuts-joint.stl
        color: "#b9bec6"
        explode: [0, 0.26, 0.97]
      - name: M2.5 x 4 screws (display)
        file: lulzbot/stl/slate/assembly/screws-frame.stl
        color: "#b9bec6"
        explode: [0, 1, -0.27]
      - name: M3 x 8 screws (base)
        file: lulzbot/stl/slate/assembly/screws-joint.stl
        color: "#b9bec6"
        explode: [0, 1, -0.28]

  # The webcam mount on the TAZ. lulzbot/pod.py assembly writes the files: each part in its place on
  # the front right corner of the frame, in mm, z up, with the origin at the middle of the top face of
  # the bed. x is to the right of the printer, and y is to the back. The frame is only the corner
  # around the mount. The camera faces the bed along (-0.87, 0.5, 0) and tilts down 52 degrees.
  - name: Camera mount on the TAZ
    description: |
      The Arducam B0561 camera on its arm at the front right corner of the TAZ Workhorse. The clamp goes on the front right upright, with a key in the front slot and a key in the right slot. Two M3 x 8 screws go into roll-in T-nuts in the slots. The arm goes on the tab of the clamp with two M3 x 18 screws into heat-set inserts. An M3 x 16 screw through the lugs of the arm holds the link. The camera hangs in its U bracket under the link, on a 1/4"-20 x 1/4" screw. A tape clip on the top front rail holds the cable.
    items:
      - name: TAZ Workhorse frame (front right corner)
        file: lulzbot/stl/camera/assembly/taz-corner.stl
        color: "#2b2d31"
      - name: T-nut (front slot)
        file: lulzbot/stl/camera/assembly/tnut-front.stl
        color: "#9aa0a8"
        explode: [0, -1, 0]
      - name: T-nut (right slot)
        file: lulzbot/stl/camera/assembly/tnut-right.stl
        color: "#9aa0a8"
        explode: [1, 0, 0]
      - part: Camera clamp (TAZ)
        file: lulzbot/stl/camera/assembly/clamp-taz.stl
        explode: [0.71, -0.71, 0]
      - name: Heat-set inserts
        file: lulzbot/stl/camera/assembly/inserts.stl
        color: "#c9a227"
        explode: [0.87, -0.5, 0]
      - name: M3 x 8 screw (front slot)
        file: lulzbot/stl/camera/assembly/screw-front.stl
        color: "#b9bec6"
        explode: [0, -1, 0]
      - name: M3 x 8 screw (right slot)
        file: lulzbot/stl/camera/assembly/screw-right.stl
        color: "#b9bec6"
        explode: [1, 0, 0]
      - part: Camera arm (TAZ)
        file: lulzbot/stl/camera/assembly/arm-taz.stl
        explode: [0.87, -0.5, 0]
      - part: Camera link (TAZ)
        file: lulzbot/stl/camera/assembly/link.stl
        explode: [-0.87, 0.5, 0]
      - name: M3 x 16 hinge screw
        file: lulzbot/stl/camera/assembly/hinge-screw.stl
        color: "#b9bec6"
        explode: [0.5, 0.87, 0]
      - name: Arducam B0561
        file: lulzbot/stl/camera/assembly/b0561.stl
        color: "#1a1b1e"
        explode: [0, 0, -1]
      - name: U bracket of the B0561
        file: lulzbot/stl/camera/assembly/b0561-bracket.stl
        color: "#3a3c40"
        explode: [0, 0, -1]
      - name: 1/4"-20 x 1/4" screw
        file: lulzbot/stl/camera/assembly/base-screw.stl
        color: "#b9bec6"
        explode: [0, 0, 1]
      - name: M3 x 18 screws (arm)
        file: lulzbot/stl/camera/assembly/joint-screws.stl
        color: "#b9bec6"
        explode: [0.87, -0.5, 0]
      - part: Cable clip, single (webcam, TAZ)
        file: lulzbot/stl/camera/assembly/cable-clip.stl
        explode: [0, -1, 0]
