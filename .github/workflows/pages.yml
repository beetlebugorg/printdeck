name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "lulzbot/stl/pod/**"
      - "lulzbot/stl/clip.stl"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docs/build.py writes the pages of docs/, and printdeck manual the manuals. The print
      # files of the pod come from lulzbot/stl/pod/, and the rail clip of the TAZ Workhorse
      # from lulzbot/stl/.
      - name: Stage the site
        run: |
          mkdir -p _site/files/pod
          cp -r docs/. _site/
          cp -r lulzbot/stl/pod/fdm lulzbot/stl/pod/resin lulzbot/stl/pod/resin-flat _site/files/pod/
          cp lulzbot/stl/clip.stl _site/files/pod/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
