name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "slate/stl/**"
      - "slate/printdeck-slate-build.pdf"
      - "lulzbot/stl/**"
      - "lulzbot/printdeck-lulzbot-build.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docs/build.py writes the pages of docs/, and printdeck manual the manuals. The downloads
      # of the two mounts come from slate/ and lulzbot/.
      - name: Stage the site
        run: |
          mkdir -p _site/files/lulzbot
          cp -r docs/. _site/
          cp slate/stl/*.stl slate/printdeck-slate-build.pdf _site/files/
          cp lulzbot/stl/*.stl lulzbot/printdeck-lulzbot-build.pdf _site/files/lulzbot/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
