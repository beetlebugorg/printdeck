name: printdeck
# A push has no title of ours: GitHub then names the run with the first line of the commit.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Printdeck slice · {0}', inputs.title || inputs.build)
      || '' }}
on:
  # A push of a branch sends a plan when it changes a file of printdeck.yml: the models, the
  # profiles, the cover, or the workflow. A push of a tag always sends a plan, because GitHub does
  # not apply the paths to tags. Printdeck makes the plan of a branch with an open pull request the
  # plan of that pull request, also for a branch of a member's fork.
  push:
    branches: ["**"]
    tags: ["v*", "release/*"]   # the releases: the Builds tab lists their plans and the plans of the pull requests
    paths:
      - printdeck.yml
      - lulzbot/**
      - profiles/**
      - docs/img/cover.png
      - .github/workflows/printdeck.yml
  workflow_dispatch:
    inputs:
      build:
        description: The Printdeck build to slice
        required: true
      title:
        description: The plates of the build, for the title of the run
        required: false

permissions:
  contents: read
  id-token: write   # the OIDC token for Printdeck

jobs:
  plan:
    name: Plan the printed parts
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the default branch, to find the parts that changed on a branch
          persist-credentials: false   # the code of a pull request reads no token in .git/config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: beetlebugorg/printdeck-action@v1
        with:
          mode: plan

  slice:
    name: Slice the plates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit alone, with no history: the Action fetches the commit of the plan, and the
          # checkout gets only the files of that commit.
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: beetlebugorg/printdeck-action@v1
        with:
          mode: slice
          build: ${{ inputs.build }}
