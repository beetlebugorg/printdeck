# ============================================================================
# Klipper configuration: LulzBot TAZ Workhorse, SE 0.5 mm tool head
# Board: UltiMachine RAMBo (ATmega2560, 16 MHz, AD5206 digipot)
#
# Sources of the values:
#   [M503]    = the Marlin EEPROM backup in ../../marlin-settings-backup-2026-09-30.txt
#   [LulzBot] = LulzBot Marlin source (gitlab.com/lulzbot3d/marlin), Workhorse sections
#   [TAZ6]    = Klipper config/printer-lulzbot-taz6-2017.cfg (same RAMBo board)
#
# Workhorse notes:
#   - X and Y home to MIN. Z homes UP to the Z MAX switch.
#   - A BLTouch is the probe (since 2026-11-11). The 4 washers at the bed corners are not used.
#   - Marlin had backlash compensation (M425 X0.25 Y0.25 Z0.04). Klipper has none.
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-UltiMachine__ultimachine.com__RAMBo_75935323230351802211-if00
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 300          # [M503] M203 X300 Y300
max_accel: 3000            # Ringing tower 2026-10-01: no ringing or layer shift up to 3500 at 80 mm/s. Marlin had 1000.
max_z_velocity: 25         # [M503] M203 Z25
max_z_accel: 100           # [M503] M201 Z100
square_corner_velocity: 5.0

# --- Steppers. 16 microsteps, 200 steps/rev. rotation_distance = 3200 / steps_per_mm
[stepper_x]
step_pin: PC0
dir_pin: !PL1              # [LulzBot] INVERT_X_DIR true for Workhorse (TAZ 6 is false)
enable_pin: !PA7
microsteps: 16
rotation_distance: 32      # [M503] M92 X100
endstop_pin: ^PB6          # X MIN, [LulzBot] X_MIN_ENDSTOP_INVERTING false
position_endstop: -50      # [LulzBot] X_MIN_POS -50
position_min: -50
position_max: 293          # [LulzBot] X_MAX_POS 293
homing_speed: 50

[stepper_y]
step_pin: PC1
dir_pin: !PL0              # [LulzBot] INVERT_Y_DIR true
enable_pin: !PA6
microsteps: 16
rotation_distance: 32      # [M503] M92 Y100
endstop_pin: ^PB5          # Y MIN (Arduino pin 11), [LulzBot] Y_HOME_DIR -1 for Workhorse
position_endstop: -17      # [LulzBot] Y_MIN_POS -17
position_min: -17
position_max: 308          # [LulzBot] Y_MAX_POS 308
homing_speed: 50

[stepper_z]
step_pin: PC2
dir_pin: PL2               # [LulzBot] INVERT_Z_DIR false
enable_pin: !PA5
microsteps: 16
rotation_distance: 6.4     # [M503] M92 Z500
endstop_pin: ^PC7          # Z MAX (Arduino pin 30): the left top switch only. [LulzBot] Z_HOME_DIR 1
position_endstop: 297      # [LulzBot] Z_MAX_POS 297. Check this on the first run.
position_max: 297
# [LulzBot] Z_MIN_POS -2. The BLTouch mesh of 2026-11-11 has the bed from Z -0.74 at the front to
# Z -1.81 at the back, and the mesh moves the nozzle down to the bed. -3 leaves room for it.
position_min: -3
# Each Z motor stops at its own top switch (since 2026-11-12), so the gantry is square after each
# home. A fast touch, then a slow second touch.
# [LulzBot] HOMING_FEEDRATE_Z 1800 mm/min (30 mm/s). The probe sets the real Z zero.
homing_speed: 25
homing_retract_dist: 5
second_homing_speed: 3

# The right Z motor, on the E1 driver, and the right top switch, on X-MAX (since 2026-11-12,
# lulzbot/dualz).
[stepper_z1]
step_pin: PC4
dir_pin: PL7               # FORCE_MOVE STEPPER=stepper_z1 DISTANCE=2 must move the right side up.
enable_pin: !PA3
microsteps: 16
rotation_distance: 6.4
endstop_pin: ^PA2          # X MAX (Arduino pin 24): the right top switch

# The guard of the home of the two Z motors: when one top switch triggers, the other must trigger
# within 10 mm. Else the home stops with an error, before a side with a failed switch drives into the
# frame (Printdeck module, deck/internal/klipper/extras/printdeck_homing).
[printdeck_homing]
max_skew: 10               # 10 mm lets a home square a gantry that tilts up to 10 mm.

# Z_TILT_ADJUST levels the X gantry to the bed: the BLTouch probes the left and the right, and each Z
# motor moves by its own amount. z_positions are the two Z belts, from the frame model of LulzBot
# (524 mm apart, about 28 mm off the bed center). ESTIMATE: retries correct a small error.
# The points are nozzle positions: the pin probes at X 15 and X 265, Y 120.
[z_tilt]
z_positions:
    -94, 140
    430, 140
points:
    3, 196
    253, 196
speed: 250
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.02

# --- SE 0.5 mm tool head (Titan Aero type drive)
[extruder]
step_pin: PC3
dir_pin: !PL6              # [LulzBot] INVERT_E0_DIR true
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.619   # [M503] M92 E420
nozzle_diameter: 0.500
filament_diameter: 2.850   # [M503] M200 D2.85
pressure_advance: 0.115     # PA tower 2026-10-01: best corners at 23 mm (0.005 per mm), 100 mm/s, PLA
max_extrude_only_distance: 100.0
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2   # [LulzBot] TEMP_SENSOR_0 5
sensor_pin: PF0
control: pid
pid_Kp: 23.606             # PID_CALIBRATE at 225, part fan on, 2026-10-01. Marlin M301 was 22.20 / 1.08 / 114.00.
pid_Ki: 1.311
pid_Kd: 106.226
min_temp: 0
max_temp: 300              # [LulzBot] HEATER_0_MAXTEMP 305
min_extrude_temp: 140        # [LulzBot] EXTRUDE_MINTEMP 140. PRINT_START retracts at the wipe temperature.

[heater_bed]
heater_pin: PE5
sensor_type: Honeywell 100K 135-104LAG-J01   # [LulzBot] TEMP_SENSOR_BED 7
sensor_pin: PF2
control: pid
pid_Kp: 286.02             # [M503] M304
pid_Ki: 54.55
pid_Kd: 374.90
min_temp: 0
max_temp: 120              # [LulzBot] BED_MAXTEMP 120

# --- Fans. RAMBo FAN0 = PH5, FAN1 = PH3, FAN2 = PE4
[fan]
pin: PH5

[heater_fan heatbreak_cooling_fan]
pin: PH3
heater: extruder
heater_temp: 50.0

[controller_fan electronics_fan]
pin: PE4                   # [LulzBot] CONTROLLER_FAN_PIN FAN2_PIN
fan_speed: 1.0
idle_speed: 0.47           # [M503] M710 S255 I120 (47 %)
idle_timeout: 60           # [M503] M710 D60

# --- Motor current. Raw digipot values, the same as Marlin: scale 255 = 1:1.
# Channel 1 = E0, 2 = E1, 4 = Z, 5 = X, 6 = Y
[ad5206 stepper_digipot]
enable_pin: PD7
scale: 255
channel_1: 177             # [M503] M907 E177
channel_2: 90              # E1: the right Z motor. Each Z motor had half of 180 on one driver.
channel_4: 90              # Z: the left Z motor. [M503] M907 Z180 was for both motors.
channel_5: 175             # [M503] M907 X175
channel_6: 175             # [M503] M907 Y175

# 16 microsteps on X, Y, Z, E0, E1
[static_digital_output stepper_config]
pins:
    PG1, PG0,
    PK7, PG2,
    PK6, PK5,
    PK3, PK4,
    PK1, PK2

[static_digital_output yellow_led]
pins: !PB7

# --- Nozzle-as-probe on the Z MIN input, conductive washers
# The BLTouch, on the front fan with the L bracket of the Creality CR-10 V3. On the left fan screw
# it hit the wiper pad. The pin is 12 mm right of the nozzle and 76 mm to the front (measured
# 2026-11-11). The cable is in lulzbot/bltouch: the control wires go to MX1 (PA0), and the probe
# wires go to Z MIN (PB4).
[bltouch]
sensor_pin: ^PB4
control_pin: PA0
x_offset: 12
y_offset: -76
# z_offset: the paper test of 2026-11-12 (paper under the nozzle only, cold bed and nozzle) gave
# 3.708. With the bed at 60 and the nozzle at 150, as PRINT_START probes, the probe read the bed
# 0.10 mm lower at the same place, so the value is 0.10 less. A larger value moves the nozzle closer.
z_offset: 3.608
speed: 5.0
lift_speed: 25.0           # max_z_velocity: the lift after each point is fast
samples: 1                 # PROBE_ACCURACY: 0.014 mm range. A second touch adds little.
sample_retract_dist: 3.0
samples_result: average
samples_tolerance: 0.05
samples_tolerance_retries: 2
# The pin stays down from point to point at horizontal_move_z (Z 8): the pin is then about 3 mm
# above the bed, clear of the corner washers. One deploy for each probe run makes the mesh much faster.
stow_on_each_sample: False

# The bed mesh corrects the tilt and the shape of the bed. mesh_min and mesh_max are pin positions,
# 15 mm in from the edges. The pin cannot go behind Y 232. PRINT_START runs PRINTDECK_MESH (see
# [printdeck_mesh]) for a fast start. The Probe key of the Bed mesh page of the deck probes the 7 x 7 points,
# and the page shows the map.
[bed_mesh]
speed: 250                 # the travel between the points
horizontal_move_z: 8
mesh_min: 15, 15
mesh_max: 265, 230
probe_count: 7, 7
algorithm: bicubic         # Lagrange permits only 6 points in a row.
# The correction is full on the first 1 mm. From 1 to 10 mm it decreases to zero. Above 10 mm the
# layers are flat to the X axis, and the top of a tall print does not copy the shape of the bed.
fade_start: 1
fade_end: 10

# The mesh at the start of a print (PRINTDECK_MESH in PRINT_START). The Probe method setting of the
# deck selects the method: the saved map of the last 7 x 7 probe and 5 or more check points (map),
# a grid under the objects of the print (adaptive), or a 3 x 3 grid (grid).
[printdeck_mesh]
method: map
grid_count: 3, 3
grid_algorithm: lagrange   # Bicubic needs 4 points in a row.
tolerance: 0.04            # mm: the check points must fit the saved map and the plane this well
checks: 2
max_points: 8
margin: 10                 # mm around the objects of the print

# --- Display (same LCD and pins as the TAZ 6)
[display]
lcd_type: st7920
cs_pin: PG4
sclk_pin: PJ2
sid_pin: PG3
encoder_pins: ^PJ6, ^PJ5
click_pin: ^!PE2
menu_timeout: 5

# The SD card in the slot of the display, on the SPI bus of the RAMBo (PB3 MISO, PB2 MOSI, PB1 SCK).
# The chip select is SDSS of pins_RAMBO.h of Marlin: pin 53, PB0. It is not checked on the printer
# yet. The deck lists the files of the card and copies one to print it (printdeck_sdcard).
[printdeck_sdcard]
cs_pin: PB0

# --- Host features for OctoPrint
[virtual_sdcard]
path: /opt/printer_data/gcodes
[pause_resume]
[display_status]
[respond]
[gcode_arcs]
[exclude_object]

[idle_timeout]
timeout: 1800

# Allows SET_KINEMATIC_POSITION and FORCE_MOVE for setup tests.
[force_move]
enable_force_move: True

# ============================================================================
# Macros
# ============================================================================

# The pause and the purge of Printdeck (printdeck.cfg has the section): after a purge at the park
# position, wipe the nozzle on the wiper pad.
[printdeck_pause]
wipe_gcode: NOZZLE_WIPE

# Strokes along the wiper pad, Y95 to Y25 and back, at X (default -17.5, the
# center of the felt) and Z (default 0.8). COUNT (default 12) is the number of the
# two-stroke cycles.
[gcode_macro NOZZLE_WIPE]
gcode:
    {% set x = params.X|default(-17.5)|float %}
    {% set z = params.Z|default(0.8)|float %}
    {% set count = params.COUNT|default(12)|int %}
    SAVE_GCODE_STATE NAME=wipe
    G90
    G1 Z10 F1200
    G1 X{x} Y95 F6000
    G1 Z{z} F600
    {% for i in range(count) %}
      G1 Y25 F3000
      G1 Y95 F3000
    {% endfor %}
    G1 Z10 F1200
    RESTORE_GCODE_STATE NAME=wipe

# Same steps as the LulzBot Cura start G-code for the Workhorse SE 0.5 mm
# Use in the slicer: PRINT_START BED=80 EXTRUDER=235 LAYER=0.4 SPEED=40
# Optional: PROBE=150 is the nozzle temperature while the bed heats and the BLTouch probes, with
# no wait for it. PLA does not leak at 150. WIPE is not used.
# SPEED is the first layer speed in mm/s. The prime strip prints at this speed.
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(80)|float %}
    {% set extruder = params.EXTRUDER|default(235)|float %}
    {% set layer = params.LAYER|default(0.4)|float %}
    {% set probe = params.PROBE|default(150)|float %}
    {% set speed = params.SPEED|default(15)|float %}
    {% set prime_lines = 2 %}
    {% set prime_x0, prime_x1, prime_y0, prime_w = 20.0, 260.0, 2.0, 0.6 %}
    # prime_e: mm of 2.85 mm filament per mm of strip line.
    # prime_speed: the first layer speed, but max. 15 mm3/s (the measured melt rate limit).
    {% set prime_e = prime_w * layer / 6.379 %}
    {% set prime_speed = [speed, 15.0 / (prime_w * layer)]|min %}
    # The run-in: at run_x mm behind the strip and Z run_z, the nozzle pushes purge_e mm
    # of filament at 10 mm3/s. Then it comes down to the
    # strip at a slant and pushes run_e mm more. The purge hangs behind the nozzle,
    # and the first line lays it down at the start. run_e is 0.12 mm per mm of the
    # slant: max_extrude_cross_section (1 mm2) permits 0.157.
    {% set run_x, run_z, purge_e = 15.0, 4.0, 5.0 %}
    {% set run_len = (run_x ** 2 + (run_z - layer) ** 2) ** 0.5 %}
    {% set run_e = run_len * 0.12 %}
    {% set run_f = run_len / (run_e * 6.379 / 10.0) * 60 %}
    M107
    G90
    M82
    G92 E0
    M104 S{probe}
    M140 S{bed}
    G28
    M83
    # The bed changes shape when it gets hot, so probe it hot.
    M117 Heating bed...
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    M117 Probing...
    Z_TILT_ADJUST
    PRINTDECK_MESH
    M104 S{extruder}
    G1 X{prime_x0 - run_x} Y{prime_y0} Z10 F5000
    M117 Heating...
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder - 2}
    # Prime strip along the front edge: 2 lines at the first layer height and speed.
    M117 Priming {prime_lines} lines...
    G1 Z{run_z} F1500
    G1 E{purge_e} F{10.0 / 6.379 * 60}
    G1 X{prime_x0} Z{layer} E{run_e} F{run_f}
    {% for i in range(prime_lines) %}
      {% set x = prime_x1 if i % 2 == 0 else prime_x0 %}
      G1 X{x} E{(prime_x1 - prime_x0) * prime_e} F{prime_speed * 60}
      G1 Y{prime_y0 + (i + 1) * prime_w} E{prime_w * prime_e} F{prime_speed * 60}
    {% endfor %}
    {% set x_end = prime_x1 if prime_lines % 2 == 1 else prime_x0 %}
    G1 X{x_end - 20 if x_end > prime_x0 else x_end + 20} Z{layer + 0.3} F3000  ; break the strip off
    M82
    G92 E1
    G1 E0 F1800                 ; retract 1 mm
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    M400
    M140 S45
    M104 S0
    M107
    G91
    G1 Z10 F1200
    G90
    G1 X145 Y0 F3000
    M83
    G1 E-14 F1800
    M82
    M117 Cooling, please wait
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=46
    G1 Y260 F1000               ; present the print
    M140 S0
    M84
    M117 Print complete

# --- Marlin compatibility for G-code from the stock LulzBot Cura profile.
# Marlin "M109 R" / "M190 R" = wait for the target, heating or cooling.
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99109 S{s}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99190 S{s}

[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99104 S{s}

[gcode_macro G29]
gcode:
    BED_MESH_CALIBRATE

[gcode_macro G12]
gcode:
    NOZZLE_WIPE

[gcode_macro M420]
gcode:
    # The mesh of PRINT_START stays on until the next probe. Nothing to do.

[gcode_macro M206]
gcode:
    # Home offsets are not used. Nothing to do.

[gcode_macro M75]
gcode:

[gcode_macro M77]
gcode:
