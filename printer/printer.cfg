# ============================================================================
# Klipper configuration: LulzBot TAZ Workhorse, SE 0.5 mm tool head
# Board: UltiMachine RAMBo (ATmega2560, 16 MHz, AD5206 digipot)
#
# Sources of the values:
#   [M503]    = the Marlin EEPROM backup in ../../marlin-settings-backup-2026-09-30.txt
#   [LulzBot] = LulzBot Marlin source (gitlab.com/lulzbot3d/marlin), Workhorse sections
#   [TAZ6]    = Klipper config/printer-lulzbot-taz6-2017.cfg (same RAMBo board)
#
# Workhorse notes:
#   - X and Y home to MIN. Z homes UP to the Z MAX switch.
#   - The nozzle is the probe: it touches 4 conductive washers at the bed corners
#     (Z MIN input). The nozzle must be clean, so PRINT_START wipes it first.
#   - Marlin had backlash compensation (M425 X0.25 Y0.25 Z0.04). Klipper has none.
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-UltiMachine__ultimachine.com__RAMBo_75935323230351802211-if00
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 300          # [M503] M203 X300 Y300
max_accel: 3000            # Ringing tower 2026-10-01: no ringing or layer shift up to 3500 at 80 mm/s. Marlin had 1000.
max_z_velocity: 25         # [M503] M203 Z25
max_z_accel: 100           # [M503] M201 Z100
square_corner_velocity: 5.0

# --- Steppers. 16 microsteps, 200 steps/rev. rotation_distance = 3200 / steps_per_mm
[stepper_x]
step_pin: PC0
dir_pin: !PL1              # [LulzBot] INVERT_X_DIR true for Workhorse (TAZ 6 is false)
enable_pin: !PA7
microsteps: 16
rotation_distance: 32      # [M503] M92 X100
endstop_pin: ^PB6          # X MIN, [LulzBot] X_MIN_ENDSTOP_INVERTING false
position_endstop: -50      # [LulzBot] X_MIN_POS -50
position_min: -50
position_max: 293          # [LulzBot] X_MAX_POS 293
homing_speed: 50

[stepper_y]
step_pin: PC1
dir_pin: !PL0              # [LulzBot] INVERT_Y_DIR true
enable_pin: !PA6
microsteps: 16
rotation_distance: 32      # [M503] M92 Y100
endstop_pin: ^PB5          # Y MIN (Arduino pin 11), [LulzBot] Y_HOME_DIR -1 for Workhorse
position_endstop: -17      # [LulzBot] Y_MIN_POS -17
position_min: -17
position_max: 308          # [LulzBot] Y_MAX_POS 308
homing_speed: 50

[stepper_z]
step_pin: PC2
dir_pin: PL2               # [LulzBot] INVERT_Z_DIR false
enable_pin: !PA5
microsteps: 16
rotation_distance: 6.4     # [M503] M92 Z500
endstop_pin: ^PC7          # Z MAX (Arduino pin 30), [LulzBot] Z_HOME_DIR 1
position_endstop: 297      # [LulzBot] Z_MAX_POS 297. Check this on the first run.
position_max: 297
position_min: -2           # [LulzBot] Z_MIN_POS -2
# The two top switches are in parallel: Z max triggers only when BOTH sides are up.
# The side that arrives first stalls and bounces on its switch. A slow second touch
# then never sees both switches pressed together, so use one fast touch only.
# [LulzBot] HOMING_FEEDRATE_Z 1800 mm/min (30 mm/s). The probe sets the real Z zero.
homing_speed: 25
homing_retract_dist: 0

# --- SE 0.5 mm tool head (Titan Aero type drive)
[extruder]
step_pin: PC3
dir_pin: !PL6              # [LulzBot] INVERT_E0_DIR true
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.619   # [M503] M92 E420
nozzle_diameter: 0.500
filament_diameter: 2.850   # [M503] M200 D2.85
pressure_advance: 0.115     # PA tower 2026-10-01: best corners at 23 mm (0.005 per mm), 100 mm/s, PLA
max_extrude_only_distance: 100.0
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2   # [LulzBot] TEMP_SENSOR_0 5
sensor_pin: PF0
control: pid
pid_Kp: 23.606             # PID_CALIBRATE at 225, part fan on, 2026-10-01. Marlin M301 was 22.20 / 1.08 / 114.00.
pid_Ki: 1.311
pid_Kd: 106.226
min_temp: 0
max_temp: 300              # [LulzBot] HEATER_0_MAXTEMP 305
min_extrude_temp: 140        # [LulzBot] EXTRUDE_MINTEMP 140. PRINT_START retracts at the wipe temperature.

[heater_bed]
heater_pin: PE5
sensor_type: Honeywell 100K 135-104LAG-J01   # [LulzBot] TEMP_SENSOR_BED 7
sensor_pin: PF2
control: pid
pid_Kp: 286.02             # [M503] M304
pid_Ki: 54.55
pid_Kd: 374.90
min_temp: 0
max_temp: 120              # [LulzBot] BED_MAXTEMP 120

# --- Fans. RAMBo FAN0 = PH5, FAN1 = PH3, FAN2 = PE4
[fan]
pin: PH5

[heater_fan heatbreak_cooling_fan]
pin: PH3
heater: extruder
heater_temp: 50.0

[controller_fan electronics_fan]
pin: PE4                   # [LulzBot] CONTROLLER_FAN_PIN FAN2_PIN
fan_speed: 1.0
idle_speed: 0.47           # [M503] M710 S255 I120 (47 %)
idle_timeout: 60           # [M503] M710 D60

# --- Motor current. Raw digipot values, the same as Marlin: scale 255 = 1:1.
# Channel 1 = E0, 2 = E1, 4 = Z, 5 = X, 6 = Y
[ad5206 stepper_digipot]
enable_pin: PD7
scale: 255
channel_1: 177             # [M503] M907 E177
channel_2: 135
channel_4: 180             # [M503] M907 Z180
channel_5: 175             # [M503] M907 X175
channel_6: 175             # [M503] M907 Y175

# 16 microsteps on X, Y, Z, E0, E1
[static_digital_output stepper_config]
pins:
    PG1, PG0,
    PK7, PG2,
    PK6, PK5,
    PK3, PK4,
    PK1, PK2

[static_digital_output yellow_led]
pins: !PB7

# --- Nozzle-as-probe on the Z MIN input, conductive washers
[probe]
pin: ^!PB4                 # [LulzBot] Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN, inverting true
z_offset: 0.86             # From a z_offset test print with a clean probe: 0.84 to 0.92 was good. A larger value moves the nozzle closer.
# The contact is electrical and triggers at once, so a faster probe stays accurate.
speed: 3.0
lift_speed: 15.0
samples: 2
sample_retract_dist: 1.0
samples_result: average
samples_tolerance: 0.1
samples_tolerance_retries: 2

# The 4 washers. [LulzBot] PROBING_MARGIN -10 on a 280 x 280 bed.
[bed_tilt]
points:
    -10, -10
    290, -10
    290, 290
    -10, 290
speed: 150
# The washers are not at the same height: on 2026-10-04 the front-left washer was at Z 1.5 and
# the front-right washer at Z 3.4. At Z 5 the nozzle hit the back-right washer on the travel
# move ("Probe triggered prior to movement"). Z 10 clears a tilt of several mm.
horizontal_move_z: 10

# --- Display (same LCD and pins as the TAZ 6)
[display]
lcd_type: st7920
cs_pin: PG4
sclk_pin: PJ2
sid_pin: PG3
encoder_pins: ^PJ6, ^PJ5
click_pin: ^!PE2
menu_timeout: 5

# The SD card in the slot of the display, on the SPI bus of the RAMBo (PB3 MISO, PB2 MOSI, PB1 SCK).
# The chip select is SDSS of pins_RAMBO.h of Marlin: pin 53, PB0. It is not checked on the printer
# yet. The deck lists the files of the card and copies one to print it (printdeck_sdcard).
[printdeck_sdcard]
cs_pin: PB0

# --- Host features for OctoPrint
[virtual_sdcard]
path: /opt/printer_data/gcodes
[pause_resume]
[display_status]
[respond]
[gcode_arcs]
[exclude_object]

[idle_timeout]
timeout: 1800

# Allows SET_KINEMATIC_POSITION and FORCE_MOVE for setup tests.
[force_move]
enable_force_move: True

# ============================================================================
# Macros
# ============================================================================

# The pause and the purge of Printdeck (printdeck.cfg has the section): after a purge at the park
# position, wipe the nozzle on the wiper pad.
[printdeck_pause]
wipe_gcode: NOZZLE_WIPE

# LulzBot G12: 12 strokes over the wiper pad, (-15, 95) to (-17, 25) at Z1
[gcode_macro NOZZLE_WIPE]
gcode:
    SAVE_GCODE_STATE NAME=wipe
    G90
    G1 Z10 F1200
    G1 X-15 Y95 F6000
    G1 Z1 F600
    {% for i in range(12) %}
      G1 X-17 Y25 F3000
      G1 X-15 Y95 F3000
    {% endfor %}
    G1 Z10 F1200
    RESTORE_GCODE_STATE NAME=wipe

# Same steps as the LulzBot Cura start G-code for the Workhorse SE 0.5 mm
# Use in the slicer: PRINT_START BED=80 EXTRUDER=235 WIPE=170 LAYER=0.4 SPEED=40
# Optional: PROBE=120 is the highest nozzle temperature for probing.
# SPEED is the first layer speed in mm/s. The prime strip prints at this speed.
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(80)|float %}
    {% set extruder = params.EXTRUDER|default(235)|float %}
    {% set wipe = params.WIPE|default(170)|float %}
    {% set layer = params.LAYER|default(0.4)|float %}
    {% set probe = params.PROBE|default(120)|float %}
    {% set speed = params.SPEED|default(15)|float %}
    {% set prime_lines = 2 %}
    {% set prime_x0, prime_x1, prime_y0, prime_w = 20.0, 260.0, 2.0, 0.6 %}
    # prime_e: mm of 2.85 mm filament per mm of strip line.
    # prime_speed: the first layer speed, but max. 15 mm3/s (the measured melt rate limit).
    {% set prime_e = prime_w * layer / 6.379 %}
    {% set prime_speed = [speed, 15.0 / (prime_w * layer)]|min %}
    M107
    G90
    M82
    G92 E0
    M104 S{wipe}
    M140 S{bed}
    G28
    M117 Heating...
    # M109 waits until the temperature is stable within 1 degree, also after an
    # overshoot. These waits only wait for the heat-up. PID holds the target.
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wipe - 2}
    M83
    G1 E-3 F500                 ; retract to reduce drool
    M106 S255                   ; fan helps the nozzle cool to the wipe temperature
    M117 Wiping nozzle...
    NOZZLE_WIPE
    # Soft plastic on a hot nozzle gave a 0.32 mm probe range. Cool it first.
    M104 S0
    M117 Cooling nozzle...
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={probe}
    M107
    M117 Probing...
    BED_TILT_CALIBRATE
    M104 S{extruder}
    G1 X{prime_x0} Y{prime_y0} Z10 F5000
    M117 Heating...
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder - 2}
    # Prime strip along the front edge: 2 lines at the first layer height and speed.
    M117 Priming {prime_lines} lines...
    G0 Z{layer} F1500
    G1 E4 F300                  ; undo the 3 mm wipe retract and fill the nozzle
    {% for i in range(prime_lines) %}
      {% set x = prime_x1 if i % 2 == 0 else prime_x0 %}
      G1 X{x} E{(prime_x1 - prime_x0) * prime_e} F{prime_speed * 60}
      G1 Y{prime_y0 + (i + 1) * prime_w} E{prime_w * prime_e} F{prime_speed * 60}
    {% endfor %}
    {% set x_end = prime_x1 if prime_lines % 2 == 1 else prime_x0 %}
    G1 X{x_end - 20 if x_end > prime_x0 else x_end + 20} Z{layer + 0.3} F3000  ; break the strip off
    M82
    G92 E1
    G1 E0 F1800                 ; retract 1 mm
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    M400
    M140 S45
    M104 S0
    M107
    G91
    G1 Z10 F1200
    G90
    G1 X145 Y0 F3000
    M83
    G1 E-14 F1800
    M82
    M117 Cooling, please wait
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=46
    G1 Y260 F1000               ; present the print
    M140 S0
    M84
    M117 Print complete

# --- Marlin compatibility for G-code from the stock LulzBot Cura profile.
# Marlin "M109 R" / "M190 R" = wait for the target, heating or cooling.
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99109 S{s}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99190 S{s}

[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99104 S{s}

[gcode_macro G29]
gcode:
    BED_TILT_CALIBRATE

[gcode_macro G12]
gcode:
    NOZZLE_WIPE

[gcode_macro M420]
gcode:
    # Klipper applies bed_tilt all the time. Nothing to do.

[gcode_macro M206]
gcode:
    # Home offsets are not used. Nothing to do.

[gcode_macro M75]
gcode:

[gcode_macro M77]
gcode:
