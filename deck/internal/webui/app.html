<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<title>Printdeck</title>
<style>
  :root { color-scheme: light dark; --bg: #d3d0c8; --plate: #e6e3dc; --edge: #a9a59c; --ink: #171717;
    --dim: #4a4742; --lcd: #1b1c1a; --amber: #ff7a30; --amberdim: #c27a48; --orange: #ff5a1f; --raised: #f3f1ec; --red: #c0291b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --plate: #1c1c1a; --edge: #060606; --ink: #eee9df; --dim: #c2bcb0;
      --lcd: #080808; --amber: #ff8c4a; --amberdim: #d98a55; --orange: #ff7a3a; --raised: #2a2a27; --red: #9c2216; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink);
    font: 16px ui-monospace, "IBM Plex Mono", Menlo, monospace; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { background: var(--lcd); color: var(--amber); font-weight: 600; letter-spacing: .12em; padding: 6px 10px; border-radius: 4px; }
  header nav a { color: var(--dim); font-size: 13px; margin-left: 12px; }
  section { background: var(--plate); border: 1px solid var(--edge); border-radius: 6px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .lcd { background: var(--lcd); color: var(--amber); border-radius: 4px; padding: 10px 12px; }
  .lcd .small { color: var(--amberdim); font-size: 13px; }
  .state { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
  .bar { height: 10px; background: var(--raised); border-radius: 5px; overflow: hidden; margin: 12px 0 6px; border: 1px solid var(--edge); }
  .bar div { height: 100%; background: var(--orange); width: 0; transition: width .5s; }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--dim); }
  .temps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .temp { background: var(--raised); border: 1px solid var(--edge); border-radius: 4px; padding: 10px; }
  .temp .label { font-size: 11px; letter-spacing: .08em; color: var(--dim); }
  .temp .value { font-size: 26px; font-weight: 600; }
  .temp .target { font-size: 13px; color: var(--dim); }
  .buttons { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
  button, .button { font: inherit; font-weight: 600; padding: 14px 10px; border: 1px solid var(--edge); border-radius: 4px;
    background: var(--raised); color: var(--ink); cursor: pointer; text-align: center; }
  button.accent { background: var(--orange); color: #121212; border-color: transparent; }
  button.danger { background: var(--red); color: #fbfaf7; border-color: transparent; }
  button.wide { grid-column: 1 / -1; }
  button:disabled { opacity: .5; }
  img.preview { display: block; width: 100%; max-width: 360px; margin: 12px auto 0; border-radius: 4px; background: var(--lcd); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--edge); }
  li:first-child { border-top: 0; }
  li .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .fdate { font-size: 12px; color: var(--dim); }
  li button { padding: 8px 12px; }
  .upload { display: grid; gap: 10px; margin-bottom: 12px; }
  .upload label { font-size: 14px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
  input[type=file] { font: inherit; font-size: 14px; max-width: 100%; }
  .music { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
  .music img { width: 96px; height: 96px; border-radius: 4px; background: var(--lcd); object-fit: cover; }
  .music .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music .artist { font-size: 14px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .transport { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; margin-top: 12px; }
  input[type=range] { width: 100%; accent-color: var(--orange); }
  .vol { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--dim); }
  .msg { font-size: 14px; color: var(--dim); line-height: 1.4; }
  .warn { color: var(--orange); font-weight: 600; font-size: 14px; margin-top: 8px; }
  .hidden { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--lcd);
    color: var(--amber); padding: 10px 14px; border-radius: 4px; font-size: 14px; max-width: 90vw; }
</style>
</head>
<body>
<main>
  <header>
    <div class="name">PRINTDECK</div>
    <nav><a href="/screen">Screen</a><a href="/system">System</a></nav>
  </header>

  <section id="printer">
    <h2>01 PRINTER</h2>
    <div class="lcd">
      <div class="state" id="state">…</div>
      <div class="file small" id="file"></div>
    </div>
    <div id="offline" class="msg hidden" style="margin-top:10px"></div>
    <div id="job" class="hidden">
      <div class="bar"><div id="progress"></div></div>
      <div class="row"><span id="percent"></span><span id="left"></span><span id="layer"></span></div>
      <div class="row" style="margin-top:4px"><span id="activity"></span></div>
      <img class="preview hidden" id="preview" alt="The model of the print">
    </div>
    <div class="warn hidden" id="firmware">The board firmware is old.</div>
    <div class="temps" style="margin-top:12px">
      <div class="temp"><div class="label">NOZZLE</div><div class="value" id="tool">–</div><div class="target" id="toolTarget"></div></div>
      <div class="temp"><div class="label">BED</div><div class="value" id="bed">–</div><div class="target" id="bedTarget"></div></div>
    </div>
    <div class="buttons" id="jobButtons">
      <button id="pause">Pause</button>
      <button class="danger" id="cancel">Cancel</button>
    </div>
    <div class="buttons" id="idleButtons">
      <button id="preheat">Preheat</button>
      <button id="cooldown">Cool down</button>
    </div>
  </section>

  <section id="filesSection">
    <h2>02 FILES</h2>
    <form class="upload" id="uploadForm">
      <input type="file" id="upload" accept=".gcode,.gco,.g">
      <label><input type="checkbox" id="printAfter"> Print after the upload</label>
      <button class="accent" type="submit" id="uploadButton">Upload</button>
    </form>
    <ul id="files"></ul>
  </section>

  <section id="musicSection" class="hidden">
    <h2>03 MUSIC</h2>
    <div class="music">
      <img id="cover" alt="">
      <div>
        <div class="title" id="title">Nothing plays</div>
        <div class="artist" id="artist"></div>
        <div class="row" style="margin-top:6px"><span id="pos"></span><span id="dur"></span></div>
      </div>
    </div>
    <div class="transport">
      <button id="prev" aria-label="Previous">⏮</button>
      <button class="accent" id="toggle">Play</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>
    <div class="vol"><span>VOL</span><input type="range" id="volume" min="0" max="100"><span id="volValue"></span></div>
  </section>
</main>
<div id="toast" class="hidden"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let st = null, previewKey = "", coverKey = "", volDragging = false, filesShown = "";

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 3500);
}
function login(r) { if (r.status === 401) { location.href = "/login"; return true; } return false; }
async function act(action, extra) {
  const r = await fetch("/api/deck/action", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, extra || {})) });
  if (login(r)) return;
  if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.error || "The Printdeck refused it."); }
}
const mmss = (s) => s < 0 ? "" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function hm(s) { if (s < 0) return ""; const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return (h ? h + " h " : "") + m + " min left"; }
const deg = (v) => Math.round(v) + "°";

function render(s) {
  st = s;
  const p = s.printer;
  $("state").textContent = !p.reachable ? (p.needsSetup ? "Printer setup" : "No Klipper") : p.paused ? "Paused" : p.text;
  $("file").textContent = p.file || "";
  const off = !p.reachable;
  $("offline").classList.toggle("hidden", !off);
  $("offline").textContent = p.needsSetup ? "Klipper has no printer yet. Set it up on the touch screen (Print tab)." : (p.error || "");
  const busy = p.printing || p.paused;
  $("job").classList.toggle("hidden", !busy);
  $("jobButtons").classList.toggle("hidden", !busy);
  $("idleButtons").classList.toggle("hidden", busy || off);
  $("firmware").classList.toggle("hidden", !p.firmwareOld);
  if (busy) {
    $("progress").style.width = p.completion.toFixed(1) + "%";
    $("percent").textContent = Math.floor(p.completion) + "%";
    $("left").textContent = hm(p.timeLeft);
    $("layer").textContent = p.layers ? "Layer " + p.layer + "/" + p.layers : "";
    $("activity").textContent = p.activity || "";
    $("pause").textContent = p.paused ? "Resume" : "Pause";
    if (p.preview !== previewKey) {
      previewKey = p.preview;
      const img = $("preview");
      img.onload = () => img.classList.remove("hidden");
      img.onerror = () => img.classList.add("hidden");
      img.src = "/api/deck/preview.png?v=" + encodeURIComponent(p.preview);
    }
  }
  $("tool").textContent = off ? "–" : deg(p.tool);
  $("bed").textContent = off ? "–" : deg(p.bed);
  $("toolTarget").textContent = p.toolTarget > 0 ? "to " + deg(p.toolTarget) : "off";
  $("bedTarget").textContent = p.bedTarget > 0 ? "to " + deg(p.bedTarget) : "off";
  $("preheat").textContent = "Preheat " + s.preheat[0] + "/" + s.preheat[1];
  for (const b of document.querySelectorAll("#files button")) b.disabled = busy || off;

  const m = s.music;
  $("musicSection").classList.toggle("hidden", !m);
  if (m) {
    $("title").textContent = m.title || (m.authorized ? "Nothing plays" : "Spotify is not linked");
    $("artist").textContent = m.artist ? m.artist + (m.album ? " · " + m.album : "") : "";
    $("pos").textContent = m.title ? mmss(m.position) : "";
    $("dur").textContent = m.title ? mmss(m.duration) : "";
    $("toggle").textContent = m.playing ? "Pause" : "Play";
    if (m.cover !== coverKey) {
      coverKey = m.cover;
      $("cover").src = m.cover ? "/api/deck/cover.jpg?v=" + encodeURIComponent(m.cover) : "";
    }
  }
  if (s.volume >= 0 && !volDragging) {
    $("volume").max = s.maxVolume; $("volume").value = s.volume; $("volValue").textContent = s.volume;
  }
}

async function loadFiles() {
  const r = await fetch("/api/deck/files");
  if (login(r) || !r.ok) return;
  const files = await r.json();
  const key = JSON.stringify(files);
  if (key === filesShown) return;
  filesShown = key;
  const ul = $("files"); ul.textContent = "";
  if (!files.length) { const li = document.createElement("li"); li.className = "msg"; li.textContent = "No files yet. Upload one, or send it from the slicer."; ul.append(li); }
  for (const f of files.slice(0, 50)) {
    const li = document.createElement("li");
    const name = document.createElement("div"); name.className = "fname";
    name.textContent = f.name;
    const date = document.createElement("div"); date.className = "fdate";
    date.textContent = f.date > 0 ? new Date(f.date * 1000).toLocaleDateString() : "";
    name.append(document.createElement("br"), date);
    const b = document.createElement("button"); b.textContent = "Print";
    b.onclick = () => { if (confirm("Print " + f.name + "?")) act("print", { path: f.path }); };
    li.append(name, b); ul.append(li);
  }
  if (st) render(st);
}

$("pause").onclick = () => act(st && st.printer.paused ? "resume" : "pause");
$("cancel").onclick = () => { if (confirm("Cancel the print?")) act("cancel"); };
$("preheat").onclick = () => act("preheat");
$("cooldown").onclick = () => act("cooldown");
$("toggle").onclick = () => act("music-toggle");
$("next").onclick = () => act("music-next");
$("prev").onclick = () => act("music-previous");
$("volume").oninput = (e) => { volDragging = true; $("volValue").textContent = e.target.value; };
$("volume").onchange = (e) => { volDragging = false; act("volume", { value: Number(e.target.value) }); };
$("uploadForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = $("upload").files[0];
  if (!f) { toast("Choose a G-code file first."); return; }
  const data = new FormData();
  data.append("file", f);
  if ($("printAfter").checked) data.append("print", "1");
  $("uploadButton").disabled = true; $("uploadButton").textContent = "Uploading…";
  try {
    const r = await fetch("/api/deck/upload", { method: "POST", body: data });
    if (login(r)) return;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) toast(j.error || "The upload failed.");
    else { toast("Uploaded " + f.name); $("upload").value = ""; filesShown = ""; loadFiles(); }
  } finally { $("uploadButton").disabled = false; $("uploadButton").textContent = "Upload"; }
};

function connect() {
  const es = new EventSource("/api/deck/events");
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => {
    es.close();
    fetch("/api/deck/state").then((r) => { if (!login(r)) setTimeout(connect, 3000); }).catch(() => setTimeout(connect, 3000));
  };
}
connect();
loadFiles();
setInterval(loadFiles, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadFiles(); });
</script>
</body>
</html>
