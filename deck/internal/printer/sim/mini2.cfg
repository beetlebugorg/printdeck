# Printdeck simulated printer: mini2
# Klipper's printer-lulzbot-mini2-2018.cfg (the LulzBot Mini 2) on the simulated board of the
# deck (serial: sim), with the thermistors that it simulates, and the LulzBot macros of
# mini2-macros.txt. Make it again with make.sh.

#This file contains pin mappings for the stock Lulzbot Mini 2 which uses
#EinsyRetro mainboard and SingleExtruder(0.5mm) hotend.
#To use this config, the firmware should be compiled for the AVR atmega2560.

# Pin numbers checked against Lulzbot fork of Marlin pins_EINSYRETRO.h
# https://gitlab.com/lulzbot3d/marlin/-/blob/master/Marlin/src/pins/rambo/
#pins_EINSY_RETRO.h
# validated against https://github.com/ultimachine/EinsyRetro/blob/1.0b/board/
#Project%20Outputs%20for%20EinsyRetro/Schematic%20Prints_EinsyRetro_1.0b.PDF

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: sim

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 40
max_z_accel: 100

[stepper_x]
step_pin: PC0
dir_pin: !PL0
enable_pin: !PA7
rotation_distance: 32
microsteps: 16
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: -7
position_min: -7
position_max: 168
homing_retract_dist: 0
homing_speed: 30

[stepper_y]
step_pin: PC1
dir_pin: !PL1
enable_pin: !PA6
rotation_distance: 32
microsteps: 16
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -5
position_min: -5
position_max: 192
homing_retract_dist: 0
homing_speed: 30

[stepper_z]
step_pin: PC2
dir_pin: !PL2
enable_pin: !PA5
rotation_distance: 32
microsteps: 16
endstop_pin: PH4
position_endstop: 183
position_max: 185
position_min: -2

[extruder]
step_pin: PC3
dir_pin: PL6
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.465
nozzle_diameter: 0.5
filament_diameter: 2.85
heater_pin: PE5
sensor_type: Generic 3950   # the thermistor of the simulated board
sensor_pin: PF0
min_temp: 0
max_temp: 280
control: pid
pid_kp: 24.121
pid_ki: 1.079
pid_kd: 134.779

[heater_bed]
heater_pin: PG5
sensor_type: Generic 3950   # the thermistor of the simulated board
sensor_pin: PF2
min_temp: 0
max_temp: 130
control: pid
pid_kp: 71.304
pid_ki: 1.662
pid_kd: 764.734

[fan]
pin: PH5

[heater_fan nozzle_cooling_fan]
pin: PH3

[probe]
pin: ^!PB4
z_offset: 1.377
#z offset will need to be adjusted if you use the magnetic bed upgrade as the
#washer thickness will apply a different offset between the nozzle and true
#bed level.
samples: 3
sample_retract_dist: 1.0
samples_tolerance: 0.200

[bed_tilt]
points: -5, 22
        -5, 190
        160, 190
        160, 22
speed: 30
horizontal_move_z: 5

[tmc2130 stepper_x]
cs_pin: PG0
run_current: 0.975
diag0_pin: ^!PK2
driver_SGT: 4
sense_resistor: 0.120

[tmc2130 stepper_y]
cs_pin: PG2
run_current: 0.975
diag0_pin: ^!PK7
driver_SGT: 4
sense_resistor: 0.120

[tmc2130 stepper_z]
cs_pin: PK5
run_current: 0.960
diag0_pin: ^!PK6
stealthchop_threshold: 999999
sense_resistor: 0.120

[tmc2130 extruder]
cs_pin: PK4
run_current: 0.960
diag0_pin: ^!PK3
stealthchop_threshold: 999999
sense_resistor: 0.120

[static_digital_output sd_card]
pins: PB0

[safe_z_home]
home_xy_position:  75, 75
speed: 30.0
z_hop: 5

[display]
lcd_type: st7920
cs_pin: PD5
sclk_pin: PD2
sid_pin: PD3
menu_timeout: 5
encoder_pins: ^PJ1,^PJ2
encoder_steps_per_detent: 2
click_pin: ^!PH6


# ============================================================================
# The LulzBot macros of printer/printer.cfg (the TAZ Workhorse), changed for the Mini 2, so a file
# from the LulzBot Cura profile prints on the simulated Mini 2. make.sh adds them to mini2.cfg.
# ============================================================================

# The pause and the purge of Printdeck (printdeck.cfg has the section): after a purge at the park
# position, wipe the nozzle on the wiper pad.
[printdeck_pause]
wipe_gcode: NOZZLE_WIPE

# LulzBot G12: 12 strokes over the wiper pad at the back, X 45 to 115 at Z1. The simulated board
# has no pad. Check the place of the pad on a real Mini 2 before you use this on it.
[gcode_macro NOZZLE_WIPE]
gcode:
    SAVE_GCODE_STATE NAME=wipe
    G90
    G1 Z10 F1200
    G1 X115 Y190 F6000
    G1 Z1 F600
    {% for i in range(12) %}
      G1 X45 Y190 F3000
      G1 X115 Y190 F3000
    {% endfor %}
    G1 Z10 F1200
    RESTORE_GCODE_STATE NAME=wipe

# The steps of the LulzBot Cura start G-code, as on the TAZ Workhorse.
# Use in the slicer: PRINT_START BED=80 EXTRUDER=235 WIPE=170 LAYER=0.4 SPEED=40
# Optional: PROBE=120 is the highest nozzle temperature for probing.
# SPEED is the first layer speed in mm/s. The prime strip prints at this speed.
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(80)|float %}
    {% set extruder = params.EXTRUDER|default(235)|float %}
    {% set wipe = params.WIPE|default(170)|float %}
    {% set layer = params.LAYER|default(0.4)|float %}
    {% set probe = params.PROBE|default(120)|float %}
    {% set speed = params.SPEED|default(15)|float %}
    {% set prime_lines = 2 %}
    {% set prime_x0, prime_x1, prime_y0, prime_w = 10.0, 150.0, 2.0, 0.6 %}
    # prime_e: mm of 2.85 mm filament per mm of strip line.
    # prime_speed: the first layer speed, but max. 15 mm3/s.
    {% set prime_e = prime_w * layer / 6.379 %}
    {% set prime_speed = [speed, 15.0 / (prime_w * layer)]|min %}
    M107
    G90
    M82
    G92 E0
    M104 S{wipe}
    M140 S{bed}
    G28
    M117 Heating...
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wipe - 2}
    M83
    G1 E-3 F500                 ; retract to reduce drool
    M106 S255                   ; fan helps the nozzle cool to the wipe temperature
    M117 Wiping nozzle...
    NOZZLE_WIPE
    M104 S0
    M117 Cooling nozzle...
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={probe}
    M107
    M117 Probing...
    BED_TILT_CALIBRATE
    M104 S{extruder}
    G1 X{prime_x0} Y{prime_y0} Z10 F5000
    M117 Heating...
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder - 2}
    # Prime strip along the front edge: 2 lines at the first layer height and speed.
    M117 Priming {prime_lines} lines...
    G0 Z{layer} F1500
    G1 E4 F300                  ; undo the 3 mm wipe retract and fill the nozzle
    {% for i in range(prime_lines) %}
      {% set x = prime_x1 if i % 2 == 0 else prime_x0 %}
      G1 X{x} E{(prime_x1 - prime_x0) * prime_e} F{prime_speed * 60}
      G1 Y{prime_y0 + (i + 1) * prime_w} E{prime_w * prime_e} F{prime_speed * 60}
    {% endfor %}
    {% set x_end = prime_x1 if prime_lines % 2 == 1 else prime_x0 %}
    G1 X{x_end - 20 if x_end > prime_x0 else x_end + 20} Z{layer + 0.3} F3000  ; break the strip off
    M82
    G92 E1
    G1 E0 F1800                 ; retract 1 mm
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    M400
    M140 S45
    M104 S0
    M107
    G91
    G1 Z10 F1200
    G90
    G1 X75 Y0 F3000
    M83
    G1 E-14 F1800
    M82
    M117 Cooling, please wait
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=46
    G1 Y190 F1000               ; present the print
    M140 S0
    M84
    M117 Print complete

# --- Marlin compatibility for G-code from the stock LulzBot Cura profile.
# Marlin "M109 R" / "M190 R" = wait for the target, heating or cooling.
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99109 S{s}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99190 S{s}

[gcode_macro M104]
rename_existing: M99104
gcode:
    {% set s = params.S|default(params.R|default(0))|float %}
    M99104 S{s}

[gcode_macro G29]
gcode:
    BED_TILT_CALIBRATE

[gcode_macro G12]
gcode:
    NOZZLE_WIPE

[gcode_macro M420]
gcode:
    # Klipper applies bed_tilt all the time. Nothing to do.

[gcode_macro M206]
gcode:
    # Home offsets are not used. Nothing to do.

[gcode_macro M75]
gcode:

[gcode_macro M77]
gcode:
