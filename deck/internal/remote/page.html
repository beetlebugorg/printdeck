<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Printdeck</title>
<style>
  :root { color-scheme: light dark; --bg: #d3d0c8; --ink: #171717; --dim: #4a4742; --edge: #a9a59c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121211; --ink: #eee9df; --dim: #c2bcb0; --edge: #060606; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px ui-monospace, "IBM Plex Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px; color: var(--dim); }
  header form { margin: 0 0 0 12px; display: inline; }
  header a { color: var(--dim); }
  header button { font: inherit; color: var(--dim); background: none; border: 1px solid var(--edge);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #status { min-width: 8em; }
  main { flex: 1; width: 100%; display: flex; justify-content: center; align-items: flex-start;
    padding: 0 16px 16px; min-height: 0; }
  /* The deck screen is 480 x 800. Fit it in the window and keep its shape. */
  #screen { display: block; height: 100%; max-height: 800px; max-width: 100%; aspect-ratio: 480 / 800;
    object-fit: contain; border-radius: 6px; box-shadow: 0 0 0 1px var(--edge); touch-action: none;
    user-select: none; -webkit-user-select: none; cursor: pointer; background: #000; }
</style>
</head>
<body>
<header>
  <span>PRINTDECK · <span id="status">connecting…</span></span>
  <span><a href="{{SOURCE}}">Source</a>
  <form method="post" action="/logout"><button type="submit">Log out</button></form></span>
</header>
<main><img id="screen" alt="The Printdeck screen" draggable="false"></main>
<script>
"use strict";
const screen = document.getElementById("screen");
const status = document.getElementById("status");

// Frames: the server sends the number of each new frame. Load only the newest one, one at a time.
let loading = false, wanted = 0, shown = 0;
async function load() {
  if (loading || wanted === shown) return;
  loading = true;
  const seq = wanted;
  try {
    const r = await fetch("/frame.png", { cache: "no-store" });
    if (r.status === 401) { location.href = "/login"; return; }
    if (r.ok) {
      const old = screen.src;
      screen.src = URL.createObjectURL(await r.blob());
      if (old) URL.revokeObjectURL(old);
      shown = seq;
    }
  } finally {
    loading = false;
    load();
  }
}
function listen() {
  const events = new EventSource("/events");
  events.onopen = () => { status.textContent = "live"; };
  events.onmessage = (e) => { wanted = Number(e.data); load(); };
  events.onerror = () => {
    status.textContent = "reconnecting…";
    // A closed stream can mean that the session ended. The frame request finds that out.
    fetch("/frame.png", { method: "HEAD" }).then((r) => { if (r.status === 401) location.href = "/login"; });
  };
}
listen();

// Touches: send down, move and up as a position from 0 to 1 on the screen.
function send(kind, e) {
  const r = screen.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  fetch("/touch", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind, x, y }), keepalive: true });
}
let down = false, lastMove = 0;
screen.addEventListener("pointerdown", (e) => {
  down = true;
  screen.setPointerCapture(e.pointerId);
  send("down", e);
});
screen.addEventListener("pointermove", (e) => {
  const now = performance.now();
  if (!down || now - lastMove < 33) return; // at most 30 moves a second
  lastMove = now;
  send("move", e);
});
function up(e) {
  if (!down) return;
  down = false;
  send("up", e);
}
screen.addEventListener("pointerup", up);
screen.addEventListener("pointercancel", up);
</script>
</body>
</html>
