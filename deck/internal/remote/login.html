<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printdeck</title>
<style>
  :root { color-scheme: light dark; --bg: #d3d0c8; --plate: #e6e3dc; --edge: #a9a59c; --ink: #171717;
    --dim: #4a4742; --lcd: #1b1c1a; --amber: #ff7a30; --orange: #ff5a1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --plate: #1c1c1a; --edge: #060606; --ink: #eee9df; --dim: #c2bcb0;
      --lcd: #080808; --amber: #ff8c4a; --orange: #ff7a3a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 16px ui-monospace, "IBM Plex Mono", Menlo, monospace; }
  form { width: 100%; max-width: 360px; background: var(--plate); border: 1px solid var(--edge);
    border-radius: 6px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: .08em; color: var(--dim); }
  .name { background: var(--lcd); color: var(--amber); font-size: 28px; font-weight: 600;
    letter-spacing: .12em; text-align: center; padding: 12px; border-radius: 4px; margin: 8px 0 20px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--edge); border-radius: 4px;
    background: var(--bg); color: var(--ink); }
  button { width: 100%; margin-top: 16px; font: inherit; font-weight: 600; padding: 12px; border: 0;
    border-radius: 4px; background: var(--orange); color: #121212; cursor: pointer; }
  button:disabled { opacity: .7; cursor: wait; }
  button:disabled::after { content: ""; display: inline-block; width: .8em; height: .8em; margin-left: .6em;
    vertical-align: -.1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .wrong { display: none; color: var(--orange); font-size: 14px; margin-top: 12px; }
  .hint { font-size: 13px; color: var(--dim); margin-top: 16px; line-height: 1.4; }
  .hint a { color: var(--dim); }
</style>
</head>
<body>
<form method="post" action="/login" id="login">
  <h1>00 REMOTE SCREEN</h1>
  <div class="name">PRINTDECK</div>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="go">Log in</button>
  <div class="wrong" id="wrong" role="alert">The password is not correct.</div>
  <div class="hint">The touch screen shows the password: Print &gt; Control &gt; Help.</div>
  <div class="hint">Printdeck is free software (AGPL-3.0). <a href="{{SOURCE}}">Source code</a></div>
</form>
<script>
  "use strict";
  // The form sends the password in the background, so the page shows what happens: the key turns
  // while the deck checks the password, a wrong password shows at once, and no answer shows after
  // 15 seconds. Without JavaScript the form posts as usual.
  const form = document.getElementById("login"), go = document.getElementById("go");
  const wrong = document.getElementById("wrong"), pw = document.getElementById("password");
  function say(text) { wrong.textContent = text; wrong.style.display = text ? "block" : "none"; }
  if (location.search.includes("wrong")) say("The password is not correct.");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    say("");
    go.disabled = true;
    go.textContent = "Checking";
    const stop = new AbortController();
    const timer = setTimeout(() => stop.abort(), 15000);
    try {
      const r = await fetch("/login", { method: "POST", body: new URLSearchParams({ password: pw.value }),
        signal: stop.signal });
      if (new URL(r.url).pathname === "/login") {
        say("The password is not correct.");
        pw.select();
      } else {
        go.textContent = "Opening the screen";
        location.href = "/";
        return;
      }
    } catch (err) {
      say(stop.signal.aborted ? "The deck did not answer. Check that it is on, and try again."
        : "No connection to the deck. Check the network, and try again.");
    } finally {
      clearTimeout(timer);
    }
    go.disabled = false;
    go.textContent = "Log in";
  });
</script>
</body>
</html>
