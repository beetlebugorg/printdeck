## Speakerdeck: the full screen UI and the Spotify Connect player.
##
##   docker compose up -d --build      set up and update
##   docker compose run --rm deck auth link the Spotify account
##
## Both services use host networking: the Spotify app finds "Speakerdeck" with mDNS, which does not
## cross a Docker bridge, and the UI talks to OctoPrint on the LAN.
## Settings are in .env (copy .env.example).

name: speakerdeck

services:
  deck:
    build: ./deck
    restart: unless-stopped
    network_mode: host
    # The UI draws on the framebuffer of the 7" display and takes tty1 from the text console.
    cap_add:
      - SYS_TTY_CONFIG
    devices:
      - /dev/fb0:/dev/fb0
      - /dev/tty1:/dev/tty1
      - /dev/snd:/dev/snd # the volume of the Amp2
    # The touch controller shows up as /dev/input/eventN, also when it is plugged in later.
    device_cgroup_rules:
      - "c 13:* rmw"
    volumes:
      - /dev/input:/dev/input
      - /etc/localtime:/etc/localtime:ro
      # The Spotify login. A host folder, not a Docker volume, so `docker compose down -v` cannot delete it.
      - /var/lib/speakerdeck:/var/lib/speakerdeck
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_DEVICE_NAME: ${SPOTIFY_DEVICE_NAME:-Speakerdeck}
      OCTOPRINT_URL: ${OCTOPRINT_URL:-http://127.0.0.1:5000}
      OCTOPRINT_API_KEY: ${OCTOPRINT_API_KEY:-}
      DISPLAY_ROTATE: ${DISPLAY_ROTATE:-90}
      TOUCH_INVERT_X: ${TOUCH_INVERT_X:-0}
      TOUCH_INVERT_Y: ${TOUCH_INVERT_Y:-0}
      TOUCH_SWAP_XY: ${TOUCH_SWAP_XY:-0}
      MAX_VOLUME: ${MAX_VOLUME:-100}
      VOLUME_FLOOR_DB: ${VOLUME_FLOOR_DB:--40}
      VOLUME_CEIL_DB: ${VOLUME_CEIL_DB:--10}
      PREHEAT_TOOL: ${PREHEAT_TOOL:-200}
      PREHEAT_BED: ${PREHEAT_BED:-60}
      NOWPLAYING_PORT: "0" # the Inky wHAT is not part of this stack

  spotify:
    build: ./docker/spotify
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    volumes:
      - spotify-config:/config # the Spotify login of the speaker
      # The settings come from this repo, not from the volume, so an update changes them.
      - ./docker/spotify/config.yml:/config/config.yml:ro

volumes:
  spotify-config:
