# The Xcode project of the watch app. Run xcodegen in this folder after a change to this file.
name: Printdeck
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    # Set your team here, and a bundle prefix that your team can use.
    DEVELOPMENT_TEAM: 7UZF9976U3
    BUNDLE_PREFIX: org.beetlebug.printdeck
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_PREFIX).shared
    # The push relay (relay/README.md).
    PUSH_RELAY: https://lxl6zbmykmd4w5yomcntsjkjma0xdwkk.lambda-url.us-east-1.on.aws
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
targets:
  Printdeck:
    type: application
    platform: iOS
    sources: [Phone, Shared, Push]
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        KeychainGroup: $(KEYCHAIN_GROUP)
        UIAppFonts: [IBMPlexMono-Regular.ttf, IBMPlexMono-SemiBold.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Printdeck finds the deck on your network and connects to it.
        NSBonjourServices: [_octoprint._tcp]
        PushRelay: $(PUSH_RELAY)
    entitlements:
      path: Phone/Phone.entitlements
      properties:
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Printdeck
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PrintdeckWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
      - target: PrintdeckNotifications
    scheme:
      testTargets: [PrintdeckTests]
  PrintdeckNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
      - Push
      - Shared/Deck.swift
      - Shared/Store.swift
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        KeychainGroup: $(KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/Notifications.entitlements
      properties:
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).notifications
        TARGETED_DEVICE_FAMILY: "1"
  PrintdeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Push/PushCrypto.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
  PrintdeckWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        KeychainGroup: $(KEYCHAIN_GROUP)
        UIAppFonts: [IBMPlexMono-Regular.ttf, IBMPlexMono-SemiBold.ttf]
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    settings:
      base:
        PRODUCT_NAME: Printdeck
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
    dependencies:
      - target: PrintdeckComplication
  PrintdeckComplication:
    type: app-extension
    platform: watchOS
    sources: [Complication, Shared]
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        KeychainGroup: $(KEYCHAIN_GROUP)
        UIAppFonts: [IBMPlexMono-Regular.ttf, IBMPlexMono-SemiBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Complication/Complication.entitlements
      properties:
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp.widget
