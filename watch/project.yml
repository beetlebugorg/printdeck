# The Xcode project of the watch app. Run xcodegen in this folder after a change to this file.
name: Printdeck
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    # Set your team here, and a bundle prefix that your team can use.
    DEVELOPMENT_TEAM: ""
    BUNDLE_PREFIX: org.beetlebug.printdeck
    APP_GROUP: group.$(BUNDLE_PREFIX)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
targets:
  Printdeck:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        AppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Printdeck tests the address and the key on the deck.
    settings:
      base:
        PRODUCT_NAME: Printdeck
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PrintdeckWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  PrintdeckWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        AppGroup: $(APP_GROUP)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: Printdeck
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp
    dependencies:
      - target: PrintdeckComplication
  PrintdeckComplication:
    type: app-extension
    platform: watchOS
    sources: [Complication, Shared]
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: Printdeck
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Complication/Complication.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp.complication
