# The Klipper sections that Printdeck needs. Include this file at the END of printer.cfg:
#
#   [include /usr/share/printdeck/klipper/printdeck.cfg]
#
# Klipper uses the last value of a setting, so the end makes these settings win over the same
# sections in printer.cfg, for example a [virtual_sdcard] path of another setup.
#
# Printdeck saves the uploads of the slicers in this folder, and starts them with
# SDCARD_PRINT_FILE.
[virtual_sdcard]
path: /var/lib/klipper/gcodes

# Pause, resume and cancel (PAUSE, RESUME, CANCEL_PRINT) for the touch screen and the slicers.
[pause_resume]

# The progress and the M117 message of the print.
[display_status]

# The two lines that the deck shows on the display of the printer, and an animation ("in", "out",
# "heat" or ""). The deck sets them with SET_GCODE_VARIABLE. The macro does nothing when it runs.
[gcode_macro _PRINTDECK]
variable_line1: ""
variable_line2: ""
variable_anim: ""
gcode:
  # Only the deck sets these variables.

# The layout of the display of the printer, with the lines of the deck. printdeck-settings writes
# this file only when printer.cfg has a [display] section, because the layout needs a display.
[include /var/lib/klipper/config/printdeck-display*.cfg]
