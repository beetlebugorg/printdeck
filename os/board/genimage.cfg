# The Printdeck disk: one image for an SD card or a USB SSD.
#
#   1 config   FAT   autoboot.txt (the A/B switch) and printdeck.txt (the user settings)
#   2 boot-a   FAT   kernel, device trees and cmdline.txt for slot A
#   3 boot-b   FAT   the same for slot B
#   4 root-a   EROFS read-only root file system of slot A
#   5 root-b   EROFS read-only root file system of slot B
#   6 data     ext4  /etc, /var and /home changes. It grows to fill the disk at the first boot.

image config.vfat {
	vfat {
		label = "PRINTDECK"
		files = { "autoboot.txt", "printdeck.txt" }
	}
	size = 16M
}

image boot-a.vfat {
	vfat {
		label = "BOOT-A"
		files = { #BOOT_FILES# }
		file cmdline.txt { image = "cmdline-a.txt" }
	}
	size = 64M
}

image boot-b.vfat {
	vfat {
		label = "BOOT-B"
		files = { #BOOT_FILES# }
		file cmdline.txt { image = "cmdline-b.txt" }
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 16M
}

image printdeck.img {
	hdimage {
		partition-table-type = "gpt"
		# Start each partition on a 1 MiB boundary, for the flash pages of the SSD.
		align = 1M
	}

	partition printdeck-config {
		partition-type-uuid = "F"
		image = "config.vfat"
	}

	partition printdeck-boot-a {
		partition-type-uuid = "F"
		image = "boot-a.vfat"
	}

	partition printdeck-boot-b {
		partition-type-uuid = "F"
		image = "boot-b.vfat"
	}

	partition printdeck-root-a {
		partition-type-uuid = "L"
		image = "rootfs.erofs"
		size = 1G
	}

	# Slot B is empty until the first update writes it.
	partition printdeck-root-b {
		partition-type-uuid = "L"
		size = 1G
	}

	partition printdeck-data {
		partition-type-uuid = "L"
		image = "data.ext4"
	}
}
