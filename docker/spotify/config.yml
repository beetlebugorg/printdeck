device_name: Speakerdeck
device_type: speaker

audio_backend: alsa
# Use the card name. ALSA indices can shift across reboots depending on
# what else enumerates, but "sndrpihifiberry" is stable. Confirmed working
# on the real Amp2 on this Pi (card: snd_rpi_hifiberry_dacplus).
# Spotify plays into the ALSA loopback. CamillaDSP reads it from there, applies the equalizer,
# and plays it to the Amp2 (hw:sndrpihifiberry).
audio_device: "hw:Loopback,0"

server:
  enabled: true
  # 0.0.0.0 replaces the "localhost" default. With host networking, other
  # containers reach this over 127.0.0.1, which only works if the server
  # actually binds all interfaces inside its own netns.
  address: "0.0.0.0"
  port: 3678

credentials:
  type: zeroconf
  zeroconf:
    persist_credentials: true

metadata:
  enabled: true

## go-librespot must not scale the samples: the speaker volume is set on the amp (the ALSA "Digital"
## control). The speakerdeck app listens to the volume events of go-librespot, so the volume slider of
## the Spotify app moves the amp, and the slider on the touch screen moves the volume in the Spotify app.
external_volume: true
