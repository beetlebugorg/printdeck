device_name: Speakerdeck
device_type: speaker

audio_backend: alsa
# Card name, not index: ALSA indices can shift across reboots depending on
# what else enumerates, but "sndrpihifiberry" is stable. Confirmed working
# on the real Amp2 on this Pi (card: snd_rpi_hifiberry_dacplus).
audio_device: "hw:sndrpihifiberry"

server:
  enabled: true
  # 0.0.0.0, not the "localhost" default: with host networking, other
  # containers reach this over 127.0.0.1, which only works if the server
  # actually binds all interfaces inside its own netns.
  address: "0.0.0.0"
  port: 3678

credentials:
  type: zeroconf
  zeroconf:
    persist_credentials: true

metadata:
  enabled: true

## The volume is set by the touch screen, on the amp (the ALSA "Digital" control), where 10% is
## really 10% of the amplitude. go-librespot must not scale the samples as well, or the sound is
## much quieter than the screen says. The volume slider in the Spotify app then changes nothing.
external_volume: true
