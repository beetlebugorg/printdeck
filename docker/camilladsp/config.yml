## CamillaDSP: the equalizer between Spotify and the amp.
##
## go-librespot plays into the ALSA loopback (hw:Loopback,0). CamillaDSP reads the other end
## (hw:Loopback,1), applies the equalizer, and plays to the HiFiBerry Amp2.
## The printdeck app changes the gains of the filters live, through the websocket on port 1234.
## These are the starting values: a flat equalizer.

title: Printdeck equalizer

devices:
  samplerate: 44100
  chunksize: 1024
  # go-librespot sends 32-bit float when the loopback allows it, so this end asks for the same.
  capture:
    type: Alsa
    device: "hw:Loopback,1"
    channels: 2
    format: F32_LE
  playback:
    type: Alsa
    device: "hw:sndrpihifiberry"
    channels: 2
    format: S32_LE
  # Stop sending to the amp after 3 s of silence (paused music).
  silence_threshold: -80
  silence_timeout: 3.0

filters:
  # Lowers everything by the largest boost of the bands, so a boost cannot clip.
  preamp:
    type: Gain
    parameters:
      gain: 0.0
      scale: dB
  eq_bass:
    type: Biquad
    parameters: {type: Lowshelf, freq: 80, gain: 0.0, slope: 6}
  eq_lowmid:
    type: Biquad
    parameters: {type: Peaking, freq: 250, gain: 0.0, q: 1.0}
  eq_mid:
    type: Biquad
    parameters: {type: Peaking, freq: 1000, gain: 0.0, q: 1.0}
  eq_highmid:
    type: Biquad
    parameters: {type: Peaking, freq: 3500, gain: 0.0, q: 1.0}
  eq_treble:
    type: Biquad
    parameters: {type: Highshelf, freq: 10000, gain: 0.0, slope: 6}

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [preamp, eq_bass, eq_lowmid, eq_mid, eq_highmid, eq_treble]
